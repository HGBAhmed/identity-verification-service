# Application
micronaut.application.name=identity-verification-service
micronaut.server.port=8080
micronaut.server.max-request-size=10MB

# Security
micronaut.security.enabled=false
micronaut.test-resources.enabled=false

# POSTGRESQL
datasources.default.url=jdbc:postgresql://localhost:5432/identity_verification
datasources.default.username=postgres
datasources.default.password=Shadow!227
datasources.default.driver-class-name=org.postgresql.Driver
datasources.default.dialect=POSTGRES

# Configuration HikariCP
datasources.default.minimum-idle=2
datasources.default.maximum-pool-size=10
datasources.default.connection-timeout=20000
datasources.default.idle-timeout=300000
datasources.default.max-lifetime=600000

# JPA Configuration
jpa.default.properties.hibernate.hbm2ddl.auto=none
jpa.default.properties.hibernate.show_sql=true
jpa.default.properties.hibernate.format_sql=true
jpa.default.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Migration
flyway.datasources.default.enabled=true
flyway.datasources.default.locations=classpath:db/migration
flyway.datasources.default.baseline-on-migrate=true
flyway.datasources.default.validate-on-migrate=false

# CONFIGURATION OPENKM
app.openkm.enabled=true
app.openkm.base-url=http://localhost:8088/OpenKM
app.openkm.username=okmAdmin
app.openkm.password=admin
app.openkm.repository-path=/okm:root/identity-verification
app.openkm.connect-timeout=30s
app.openkm.read-timeout=60s

# Dossiers OpenKM
app.openkm.folders.identity-documents=/okm:root/identity-verification/documents
app.openkm.folders.user-photos=/okm:root/identity-verification/photos
app.openkm.folders.temp=/okm:root/identity-verification/temp

# CONFIGURATION FICHIERS
app.file-storage.base-path=./uploads
app.file-storage.max-file-size=5MB
app.file-storage.allowed-extensions=jpg,jpeg,png,pdf
app.file-storage.temp-path=./temp
app.file-storage.temp-cleanup-delay=300

# CONFIGURATION SCRIPTS PYTHON
app.face-comparison.python-script-path=./python_scripts/face_comparison.py
app.face-comparison.confidence-threshold=0.8
app.document-extraction.python-script-path=./python_scripts/document_extractor.py

# CONFIGURATION SESSIONS
app.sessions.ttl-minutes=30
app.sessions.cleanup-interval-minutes=10

# LOGGING
logger.levels.sn.sensoft.identity=DEBUG
logger.levels.com.zaxxer.hikari=DEBUG
logger.levels.org.hibernate.SQL=DEBUG
logger.levels.io.micronaut.http.client=TRACE