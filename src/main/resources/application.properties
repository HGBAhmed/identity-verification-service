# Application
micronaut.application.name=identity-verification-service
micronaut.server.port=8080
micronaut.server.max-request-size=10MB

# security
micronaut.security.enabled=false

# Database
datasources.default.url=jdbc:postgresql://localhost:5432/identity_verification
datasources.default.username=postgres
datasources.default.password=postgres
datasources.default.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
jpa.default.properties.hibernate.hbm2ddl.auto=validate
jpa.default.properties.hibernate.show_sql=true

# Flyway
flyway.datasources.default.locations=classpath:db/migration

# Configuration
app.file-storage.base-path=./uploads
app.file-storage.max-file-size=5MB
app.file-storage.allowed-extensions=jpg,jpeg,png,pdf
app.face-comparison.python-script-path=./python_scripts/face_comparison.py
app.face-comparison.confidence-threshold=0.8
