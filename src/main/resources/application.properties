# Application
micronaut.application.name=identity-verification-service
micronaut.server.port=8080
micronaut.server.max-request-size=10MB

# SECURITY CONFIGURATION
# Activer la sécurité
micronaut.security.enabled=true

# Configuration JWT pour Keycloak
micronaut.security.token.jwt.enabled=true
micronaut.security.token.jwt.signatures.jwks.keycloak.url=http://localhost:8090/realms/identity-verification/protocol/openid-connect/certs
#micronaut.security.token.jwt.roles-name=realm_access.roles
micronaut.security.token.jwt.claims-validators.issuer=http://localhost:8090/realms/identity-verification

# Mode rejet (endpoints sont sécurisés par défaut, sauf exceptions)
micronaut.security.reject-not-found=false

# Endpoints
micronaut.security.intercept-url-map[0].pattern=/health/**
micronaut.security.intercept-url-map[0].access[0]=isAnonymous()
micronaut.security.intercept-url-map[1].pattern=/metrics/**
micronaut.security.intercept-url-map[1].access[0]=isAnonymous()
micronaut.security.intercept-url-map[2].pattern=/api/v1/verification/health
micronaut.security.intercept-url-map[2].access[0]=isAnonymous()
micronaut.security.intercept-url-map[3].pattern=/api/v1/verification/files/**
micronaut.security.intercept-url-map[3].access[0]=ADMIN
micronaut.security.intercept-url-map[3].access[1]=VERIFICATION_USER
micronaut.security.intercept-url-map[3].access[2]=VIEWER
# Test Resources
micronaut.test-resources.enabled=false

# POSTGRESQL CONFIGURATION
datasources.default.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:identity_verification}
datasources.default.username=${DB_USERNAME:postgres}
datasources.default.password=${DB_PASSWORD}
datasources.default.driver-class-name=org.postgresql.Driver
datasources.default.dialect=POSTGRES

# Configuration HikariCP
datasources.default.minimum-idle=2
datasources.default.maximum-pool-size=10
datasources.default.connection-timeout=20000
datasources.default.idle-timeout=300000
datasources.default.max-lifetime=600000

# JPA Configuration
jpa.default.properties.hibernate.hbm2ddl.auto=none
jpa.default.properties.hibernate.show_sql=false
jpa.default.properties.hibernate.format_sql=true
jpa.default.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Migration
flyway.datasources.default.enabled=true
flyway.datasources.default.locations=classpath:db/migration
flyway.datasources.default.baseline-on-migrate=true
flyway.datasources.default.validate-on-migrate=false

# OPENKM CONFIGURATION
app.openkm.enabled=true
app.openkm.base-url=${OPENKM_BASE_URL:http://localhost:8088/OpenKM}
app.openkm.username=${OPENKM_USERNAME}
app.openkm.password=${OPENKM_PASSWORD}
app.openkm.connect-timeout=30s
app.openkm.read-timeout=60s

# Dossiers OpenKM
app.openkm.repository-path=${OPENKM_ROOT_PATH:/okm:root/identity-verification}
app.openkm.folders.identity-documents=${OPENKM_DOCS_FOLDER:/okm:root/identity-verification/documents}
app.openkm.folders.user-photos=${OPENKM_PHOTOS_FOLDER:/okm:root/identity-verification/photos}
app.openkm.folders.temp=${OPENKM_TEMP_FOLDER:/okm:root/identity-verification/temp}

# FILE STORAGE CONFIGURATION
app.file-storage.base-path=${STORAGE_BASE_PATH:./uploads}
app.file-storage.temp-path=${STORAGE_TEMP_PATH:./temp}
app.file-storage.max-file-size=10MB
app.file-storage.allowed-extensions=jpg,jpeg,png,pdf
app.file-storage.temp-cleanup-delay=300

# Configuration conversion PDF
app.pdf-conversion.dpi=300
app.pdf-conversion.output-format=jpg
app.pdf-conversion.max-pages=5

# PYTHON SCRIPTS CONFIGURATION
app.face-comparison.python-script-path=${PYTHON_FACE_SCRIPT:./python_scripts/face_comparison.py}
app.document-extraction.python-script-path=${PYTHON_DOC_SCRIPT:./python_scripts/document_extractor.py}
app.face-comparison.default-threshold=0.68

#optimisation des scripts python
app.python.cache.enabled=true
app.python.initialization.timeout=30s
app.python.process.reuse=true

# SESSIONS CONFIGURATION
app.sessions.ttl-minutes=30
app.sessions.cleanup-interval-minutes=10

# LOGGING CONFIGURATION
logger.levels.sn.sensoft.identity=INFO
logger.levels.com.zaxxer.hikari=WARN
logger.levels.org.hibernate.SQL=WARN
logger.levels.io.micronaut.http.client=WARN

# Logs Security
logger.levels.io.micronaut.security=WARN
logger.levels.io.micronaut.security.token.jwt=WARN
logger.levels.io.micronaut.security.oauth2=WARN


# Forcer l'encodage UTF-8
spring.output.ansi.enabled=never
file.encoding=UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# Configuration logging
logging.charset.console=UTF-8
logging.charset.file=UTF-8

# Logging pour conversion
logger.levels.sn.sensoft.identity.service.PdfConversionService=INFO

micronaut.server.multipart.max-file-size=10MB
micronaut.server.multipart.threshold=1MB
micronaut.server.multipart.location=${java.io.tmpdir}

# Limite globale Netty
micronaut.server.netty.max-content-length=15MB