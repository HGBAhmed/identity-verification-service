services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: identity_verification
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: MDP
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - identity-network

  identity-app:
    build:
      context: .
      dockerfile: docker/Dockerfile.java
    environment:
      DB_HOST: postgres
      DB_USERNAME: postgres
      DB_PASSWORD: MDP
      OPENKM_BASE_URL: http://openkm:8080/OpenKM
      OPENKM_USERNAME: okmAdmin
      OPENKM_PASSWORD: admin
    volumes:
      - shared_temp:/app/shared-temp
    ports:
      - "8080:8080"
    networks:
      - identity-network
    depends_on:
      - postgres
      - ai-server

  ai-server:
    build:
      context: .
      dockerfile: docker/Dockerfile
    volumes:
      - shared_temp:/app/shared-temp
    ports:
      - "5000:5000"
    networks:
      - identity-network

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.1
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: MDP
      KC_HOSTNAME: localhost
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: MDP
      KC_HTTP_ENABLED: true
      KC_HTTPS_ENABLED: false
    ports:
      - "8090:8080"
    networks:
      - identity-network
    depends_on:
      - postgres
    command: start-dev

  openkm:
    image: openkm/openkm-ce
    volumes:
      - openkm_data:/opt/tomcat
    ports:
      - "8088:8080"
    networks:
      - identity-network

volumes:
  postgres_data:
  shared_temp:
  openkm_data:

networks:
  identity-network: